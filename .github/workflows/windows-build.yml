name: Build KAYNA CONTROL for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'db.js'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: KAYNA-CONTROL-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
